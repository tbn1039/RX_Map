<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2a37">
<title>수신상태 체크</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif; background: #f3f4f6; color: #111827; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  #map { flex: 1 1 auto; min-height: 120px; position: relative; }
  .map-btns { position: absolute; right: 10px; top: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
  .map-btns button { width: 42px; height: 42px; border: 0; border-radius: 10px; background: #fff; font-size: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .map-btns button.on { background: #2563eb; color: #fff; }

  #gps { position: absolute; left: 10px; top: 10px; z-index: 1000; background: rgba(255,255,255,.92); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 1px 6px rgba(0,0,0,.3); max-width: calc(100% - 80px); }
  #gps.bad { background: #fee2e2; }

  #panel { flex: 0 0 auto; background: #fff; border-top: 1px solid #d1d5db; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); max-height: 56dvh; overflow-y: auto; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { font-weight: 700; white-space: nowrap; }
  .freqline { display: flex; gap: 6px; margin-bottom: 4px; }
  .row.frow { flex: 1 1 0; min-width: 0; gap: 4px; margin-bottom: 0; border: 2px solid transparent; border-radius: 12px; padding: 3px 4px; }
  .row.frow.sel { border-color: #2563eb; background: #eff6ff; }
  .chbadge { width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; background: #6b7280; color: #fff; font-weight: 800; flex: 0 0 28px; }
  .frow.sel .chbadge { background: #2563eb; }
  .freqin { flex: 1; min-width: 0; width: 100%; font-size: 19px; padding: 8px 6px; border: 2px solid #9ca3af; border-radius: 10px; }
  .freqin:focus { outline: none; border-color: #2563eb; }
  .unit { color: #4b5563; font-weight: 700; }

  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; position: relative; }
  .status button { border: 0; border-radius: 12px; padding: 14px 0; font-size: 20px; font-weight: 800; color: #fff; }
  .status button:active { transform: scale(.97); filter: brightness(.9); }
  .status button small { display: block; font-size: 12px; font-weight: 600; opacity: .9; margin-top: 2px; }
  .status.running button { opacity: .45; }
  .status.running button.active { opacity: 1; outline: 4px solid #111827; outline-offset: -4px; box-shadow: 0 0 0 3px #fff inset; }
  .status button.chtoggle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 132px; height: 132px; padding: 0; border-radius: 50%; border: 5px solid #fff; background: #2563eb; color: #fff; font-weight: 800; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 1 !important; outline: none !important; box-shadow: 0 2px 8px rgba(0,0,0,.45) !important; z-index: 5; }
  .status button.chtoggle[data-ch="1"] { background: #7c3aed; }
  .status button.chtoggle small { font-size: 13px; margin: 0; }
  .status button.chtoggle span { display: block; font-size: 32px; max-width: 110px; white-space: nowrap; overflow: hidden; }
  .status button.chtoggle:active { transform: translate(-50%, -50%) scale(.93); filter: brightness(.9); }
  #runinfo { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #374151; }
  #runinfo div.on { color: #166534; }
  #keyinfo { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
  .s-good { background: #2e9e4f; }
  .s-weak { background: #d9a800; }
  .s-bad  { background: #f08a00; }
  .s-int  { background: #d93025; }

  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .tools button { flex: 1; border: 1px solid #9ca3af; background: #f9fafb; border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 700; }
  .tools button.danger { color: #b91c1c; border-color: #fca5a5; }

  #count { font-size: 13px; color: #4b5563; margin-bottom: 4px; }
  #list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #list li { padding: 5px 0; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: baseline; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; align-self: center; }
  #list small { color: #6b7280; }

  #toast { position: fixed; left: 50%; bottom: 40%; transform: translateX(-50%); background: rgba(17,24,39,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 15px; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; max-width: 90%; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="map">
  <div id="gps">위치 확인 중...</div>
  <div class="map-btns">
    <button id="btnLocate" title="내 위치로 이동">◎</button>
    <button id="btnFollow" title="내 위치 따라가기">⌖</button>
    <button id="btnAwake" title="화면 항상 켜짐">☀</button>
    <button id="btnRemote" title="터치 리모컨 모드">🎮</button>
    <button id="btnLearn" title="리모컨 가운데 버튼 등록">🎯</button>
    <button id="btnVoice" title="음성 안내">🔊</button>
  </div>
</div>

<div id="panel">
  <div class="freqline">
    <div class="row frow sel" id="frow0">
      <span class="chbadge">1</span>
      <input id="freq0" class="freqin" type="text" inputmode="decimal" placeholder="예: 91.9" autocomplete="off" aria-label="주파수1 (MHz)">
    </div>
    <div class="row frow" id="frow1">
      <span class="chbadge">2</span>
      <input id="freq1" class="freqin" type="text" inputmode="decimal" placeholder="선택" autocomplete="off" aria-label="주파수2 (MHz)">
    </div>
  </div>

  <div class="status" id="statusBox">
    <button class="s-good" data-s="양청">양청<small>10초 간격</small></button>
    <button class="s-weak" data-s="약잡음">약잡음<small>7초 간격</small></button>
    <button class="s-bad" data-s="난청">난청<small>5초 간격</small></button>
    <button class="s-int" data-s="혼신">혼신<small>3초 간격</small></button>
    <button class="chtoggle" id="chToggle" data-ch="0" title="주파수 1/2 전환"><small id="chLabel">주파수 1</small><span id="chFreq">--</span><small>MHz</small></button>
  </div>
  <div id="runinfo"><div id="run0"></div><div id="run1"></div></div>
  <div id="keyinfo">리모컨: ▲양청 ▼난청 ◀약잡음 ▶혼신 / 가운데 원·OK(Enter)=주파수 전환 / Esc=선택 정지<span id="lastkey"></span></div>

  <div class="tools">
    <button id="btnStop">전체 정지</button>
    <button id="btnExport">CSV 저장</button>
    <button id="btnShare" style="display:none">공유</button>
    <button id="btnUndo">마지막 취소</button>
    <button id="btnClear" class="danger">전체 삭제</button>
  </div>

  <div id="count"></div>
  <ul id="list"></ul>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var COLORS = { "양청": "#2e9e4f", "약잡음": "#d9a800", "난청": "#f08a00", "혼신": "#d93025" };
  var REC_KEY = "rx_records_v1";
  var FREQ_KEY = "rx_freq_v1";
  var FREQ2_KEY = "rx_freq2_v1";

  /* ---------- 저장소 ---------- */
  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(REC_KEY)) || []; } catch (e) { return []; }
  }
  function saveRecords() {
    try { localStorage.setItem(REC_KEY, JSON.stringify(records)); }
    catch (e) { toast("저장 공간 오류: CSV로 먼저 내보내세요"); }
  }
  var records = loadRecords();

  /* ---------- 유틸 ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtTime(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
           pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  function fileStamp(d) {
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" +
           pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function esc(v) {
    v = String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  /* ---------- 음성 안내 (TTS) ---------- */
  var VOICE_KEY = "rx_voice_v1";
  var voiceOn = true;
  try { voiceOn = localStorage.getItem(VOICE_KEY) !== "0"; } catch (e) {}
  var btnVoice = document.getElementById("btnVoice");
  function updateVoiceBtn() {
    btnVoice.textContent = voiceOn ? "🔊" : "🔇";
    btnVoice.classList.toggle("on", voiceOn);
  }
  function say(text) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  btnVoice.addEventListener("click", function () {
    voiceOn = !voiceOn;
    try { localStorage.setItem(VOICE_KEY, voiceOn ? "1" : "0"); } catch (e) {}
    updateVoiceBtn();
    toast(voiceOn ? "음성 안내 켬" : "음성 안내 끔");
    if (voiceOn) say("음성 안내를 켭니다");
  });
  updateVoiceBtn();

  /* ---------- 지도 ---------- */
  // keyboard:false -> 리모컨 방향키가 지도 이동에 쓰이지 않도록 함
  var map = L.map("map", { zoomControl: false, preferCanvas: true, keyboard: false }).setView([36.5, 127.8], 7);
  L.control.zoom({ position: "bottomleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  var markerLayer = L.layerGroup().addTo(map);
  var meDot = null, meCircle = null;
  var lastFix = null;
  var follow = true;
  var firstFix = true;

  var btnFollow = document.getElementById("btnFollow");
  function setFollow(on) {
    follow = on;
    btnFollow.classList.toggle("on", on);
  }
  setFollow(true);
  map.on("dragstart", function () { setFollow(false); });
  btnFollow.addEventListener("click", function () {
    setFollow(!follow);
    if (follow && lastFix) map.panTo([lastFix.lat, lastFix.lon]);
    toast(follow ? "내 위치 따라가기 켬" : "내 위치 따라가기 끔");
  });
  document.getElementById("btnLocate").addEventListener("click", function () {
    if (!lastFix) { toast("아직 위치를 받지 못했습니다"); return; }
    map.setView([lastFix.lat, lastFix.lon], Math.max(map.getZoom(), 16));
  });

  // 주파수1: 채워진 작은 점, 주파수2: 속이 빈 큰 원 (같은 위치에서도 둘 다 보이도록)
  function addMarker(r) {
    var c = COLORS[r.status];
    var second = r.ch === 1;
    var m = L.circleMarker([r.lat, r.lon], second
      ? { radius: 8, color: c, weight: 3, fillColor: c, fillOpacity: 0 }
      : { radius: 4, color: c, weight: 1, fillColor: c, fillOpacity: 0.95 });
    m.bindPopup("<b>" + r.status + "</b><br>" + (second ? "주파수2 " : "주파수1 ") + r.freq + " MHz<br>" + r.time + "<br>정확도 ±" + r.acc + " m");
    m.addTo(markerLayer);
  }
  function redrawMarkers() {
    markerLayer.clearLayers();
    records.forEach(addMarker);
  }

  /* ---------- GPS ---------- */
  var gpsEl = document.getElementById("gps");
  function onPos(p) {
    var lat = p.coords.latitude, lon = p.coords.longitude, acc = Math.round(p.coords.accuracy);
    lastFix = { lat: lat, lon: lon, acc: acc, t: Date.now() };
    gpsEl.classList.remove("bad");
    gpsEl.textContent = "위치 ±" + acc + " m";

    if (!meDot) {
      meCircle = L.circle([lat, lon], { radius: p.coords.accuracy, color: "#2563eb", weight: 1, fillColor: "#2563eb", fillOpacity: 0.12 }).addTo(map);
      meDot = L.circleMarker([lat, lon], { radius: 8, color: "#ffffff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
    } else {
      meCircle.setLatLng([lat, lon]).setRadius(p.coords.accuracy);
      meDot.setLatLng([lat, lon]);
    }
    if (firstFix) {
      map.setView([lat, lon], 16);
      firstFix = false;
    } else if (follow) {
      map.panTo([lat, lon], { animate: true });
    }
  }
  function onPosErr(err) {
    gpsEl.classList.add("bad");
    var msg = "위치를 받을 수 없습니다";
    if (err.code === 1) msg = "위치 권한이 거부되었습니다. 브라우저 설정에서 허용하세요";
    else if (err.code === 2) msg = "위치 신호를 찾는 중입니다";
    else if (err.code === 3) msg = "위치 응답 시간 초과, 다시 시도 중";
    gpsEl.textContent = msg;
  }
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(onPos, onPosErr, {
      enableHighAccuracy: true, maximumAge: 2000, timeout: 20000
    });
  } else {
    gpsEl.classList.add("bad");
    gpsEl.textContent = "이 기기는 위치 기능을 지원하지 않습니다";
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    gpsEl.classList.add("bad");
    gpsEl.textContent = "https 주소로 접속해야 위치를 쓸 수 있습니다";
  }

  /* ---------- 주파수 2채널 ---------- */
  var FREQ_KEYS = [FREQ_KEY, FREQ2_KEY];
  var rows = [document.getElementById("frow0"), document.getElementById("frow1")];
  var chs = [];      // 채널별 상태: { idx, input, status, timer }
  var sel = 0;       // 리모컨/버튼 조작 대상 채널 (0 = 주파수1, 1 = 주파수2)
  [0, 1].forEach(function (i) {
    var inp = document.getElementById("freq" + i);
    try { inp.value = localStorage.getItem(FREQ_KEYS[i]) || ""; } catch (e) {}
    inp.addEventListener("input", function () {
      try { localStorage.setItem(FREQ_KEYS[i], inp.value.trim()); } catch (e) {}
      if (chs[i].status) stopChannel(chs[i], true);  // 기록 중 주파수 값을 고치면 기록 정지
      updateRunUI();
    });
    inp.addEventListener("focus", function () {
      if (sel !== i) { stopAll(); sel = i; updateRunUI(); }
    });
    rows[i].querySelector(".chbadge").addEventListener("click", function () { selectChannel(i); });
    chs.push({ idx: i, input: inp, status: null, timer: null });
  });

  /* ---------- 기록 ---------- */
  var INTERVALS = { "양청": 10, "약잡음": 7, "난청": 5, "혼신": 3 };
  var statusBox = document.getElementById("statusBox");
  var statusBtns = statusBox.querySelectorAll("button[data-s]");
  var chToggle = document.getElementById("chToggle");
  chToggle.addEventListener("click", function () { selectChannel(sel === 0 ? 1 : 0); });

  function updateRunUI() {
    chs.forEach(function (c, i) {
      var el = document.getElementById("run" + i);
      var f = c.input.value.trim();
      var label = (i === sel ? "▶ " : "") + "주파수" + (i + 1) + (f ? " " + f : "");
      if (c.status) {
        el.textContent = label + " : 기록 중 " + c.status + " (" + INTERVALS[c.status] + "초)";
        el.classList.add("on");
      } else {
        el.textContent = label + " : 정지";
        el.classList.remove("on");
      }
      rows[i].classList.toggle("sel", i === sel);
    });
    var cur = chs[sel];
    chToggle.setAttribute("data-ch", sel);
    var curFreq = cur.input.value.trim();
    document.getElementById("chLabel").textContent = "주파수 " + (sel + 1);
    var chFreqEl = document.getElementById("chFreq");
    chFreqEl.textContent = curFreq || "--";
    chFreqEl.style.fontSize = curFreq.length > 6 ? "20px" : (curFreq.length > 4 ? "26px" : "32px");
    statusBox.classList.toggle("running", !!cur.status);
    Array.prototype.forEach.call(statusBtns, function (b) {
      b.classList.toggle("active", b.getAttribute("data-s") === cur.status);
    });
  }
  function selectChannel(i) {
    // 주파수가 바뀌면 진행 중인 기록은 모두 정지 (상태 버튼을 다시 눌러야 기록 시작)
    var stopped = (i !== sel) && chs.some(function (c) { return !!c.status; });
    if (stopped) stopAll();
    sel = i;
    updateRunUI();
    var f = chs[i].input.value.trim();
    toast("주파수" + (i + 1) + " 선택" + (f ? " (" + f + " MHz)" : " - 주파수를 입력하세요") + (stopped ? " · 기록 정지" : ""));
    say("주파수 " + (i + 1) + "번" + (f ? ", " + f + " 메가헤르츠" : ", 입력 필요") + (stopped ? ", 기록 정지" : ""));
  }
  function stopChannel(c, showMsg) {
    if (c.timer) { clearInterval(c.timer); c.timer = null; }
    c.status = null;
    updateRunUI();
    if (showMsg) { toast("주파수" + (c.idx + 1) + " 기록 정지"); say((c.idx + 1) + "번 기록 정지"); }
  }
  function stopAll() {
    chs.forEach(function (c) {
      if (c.timer) { clearInterval(c.timer); c.timer = null; }
      c.status = null;
    });
    updateRunUI();
  }
  function startRecording(status, fromKey) {
    var c = chs[sel];
    var n = c.idx + 1;
    var freq = c.input.value.trim();
    if (!freq) {
      toast("주파수" + n + "을 먼저 입력하세요");
      say("주파수 " + n + "번을 입력하세요");
      if (!fromKey) c.input.focus();
      return;
    }
    if (c.status === status) {  // 같은 상태 재입력은 유지
      toast("주파수" + n + " 이미 " + status + " 기록 중");
      say(n + "번 이미 " + status);
      return;
    }
    if (c.timer) clearInterval(c.timer);
    c.status = status;
    updateRunUI();
    if (record(c, status, true)) say(n + "번 " + freq + ", " + status);
    c.timer = setInterval(function () { record(c, c.status, false); }, INTERVALS[status] * 1000);
  }

  function record(c, status, manual) {
    var freq = c.input.value.trim();
    if (!freq) { if (manual) toast("주파수" + (c.idx + 1) + "을 먼저 입력하세요"); return false; }
    if (!lastFix) {
      if (manual) { toast("위치를 아직 받지 못했습니다"); say("위치를 아직 받지 못했습니다"); }
      return false;
    }
    var r = {
      time: fmtTime(new Date()),
      freq: freq,
      lat: +lastFix.lat.toFixed(6),
      lon: +lastFix.lon.toFixed(6),
      acc: lastFix.acc,
      status: status,
      ch: c.idx
    };
    records.push(r);
    saveRecords();
    addMarker(r);
    render();
    if (navigator.vibrate) navigator.vibrate(manual ? 40 : 15);
    if (manual) toast("주파수" + (c.idx + 1) + " " + status + " 기록 시작 (" + INTERVALS[status] + "초 간격)");
    return true;
  }
  Array.prototype.forEach.call(statusBtns, function (b) {
    b.addEventListener("click", function () { startRecording(b.getAttribute("data-s"), false); });
  });
  document.getElementById("btnStop").addEventListener("click", function () {
    var any = chs.some(function (c) { return !!c.status; });
    if (!any) { toast("이미 정지 상태입니다"); return; }
    stopAll();
    toast("기록 정지 (전체)");
    say("전체 기록 정지");
  });

  /* ---------- 블루투스 리모컨 (방향키) ---------- */
  // 상=양청, 하=난청, 좌=약잡음, 우=혼신 / Enter·Space·PageUp·PageDown = 주파수1↔2 전환
  // 1, 2 = 주파수 직접 선택 / Esc·Backspace = 선택된 주파수 기록 정지
  var KEYMAP = { ArrowUp: "양청", ArrowDown: "난청", ArrowLeft: "약잡음", ArrowRight: "혼신" };
  var lastKeyEl = document.getElementById("lastkey");
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var inInput = !!(e.target && e.target.tagName === "INPUT");
    var status = KEYMAP[key];

    // 가운데 버튼 등록 중: 키 신호이면 그 키를 저장
    if (learning && !status && ["Shift", "Control", "Alt", "Meta"].indexOf(key) < 0) {
      e.preventDefault();
      learnedKey = key;
      tapPoint = null;
      try { localStorage.setItem(LKEY_KEY, key); localStorage.removeItem(TAP_KEY); } catch (er) {}
      endLearning();
      toast("가운데 버튼 등록: 키 " + key);
      return;
    }

    var isToggle = (key === "Enter" || key === " " || key === "PageDown" || key === "PageUp" ||
                    MEDIA_KEYS.indexOf(key) >= 0 || (learnedKey && key === learnedKey));
    var isNum = (key === "1" || key === "2");
    var isStop = (key === "Escape" || key === "Backspace");

    if (!inInput || status) {
      lastKeyEl.textContent = " [마지막 입력: " + (key === " " ? "Space" : key) + "]";
    }
    if (!status && !isToggle && !isNum && !isStop) return;

    // 주파수 입력 중에는 일반 타이핑을 방해하지 않음
    if (inInput && (key === " " || isNum || isStop)) return;
    if (inInput && key === "Enter") { e.target.blur(); e.preventDefault(); return; }

    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (e.repeat) return;

    if (status) {
      startRecording(status, true);
    } else if (isToggle) {
      selectChannel(sel === 0 ? 1 : 0);
    } else if (isNum) {
      selectChannel(+key - 1);
    } else if (isStop) {
      var c = chs[sel];
      if (c.status) stopChannel(c, true);
      else toast("주파수" + (sel + 1) + "은 이미 정지 상태입니다");
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === " " && !(e.target && e.target.tagName === "INPUT")) e.preventDefault();
  });

  // 진단용: 리모컨이 키가 아니라 터치/클릭/스와이프로 동작하는지 확인
  var tStart = null;
  document.addEventListener("pointerdown", function (e) {
    lastKeyEl.textContent = " [" + e.pointerType + " 눌림 (" + Math.round(e.clientX) + "," + Math.round(e.clientY) + ")]";
  }, true);
  document.addEventListener("pointercancel", function (e) {
    lastKeyEl.textContent = " [" + e.pointerType + " 취소(스크롤/스와이프 가능성)]";
  }, true);
  document.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    var onInput = !!(e.target && (e.target.tagName === "INPUT" || (e.target.closest && e.target.closest("#btnLearn"))));
    tStart = (e.touches.length > 1 || onInput) ? null : { x: t.clientX, y: t.clientY };
  }, { capture: true, passive: true });
  var onTouchEnd = function (e) {
    if (!tStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
    var sx = tStart.x, sy = tStart.y;
    tStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) <= 12) {
      // 탭: 가운데 버튼 등록 중이면 위치 저장, 등록된 위치와 같으면 주파수 전환
      if (learning) {
        e.preventDefault();
        swallowClickUntil = Date.now() + 700;
        tapPoint = { fx: sx / window.innerWidth, fy: sy / window.innerHeight };
        learnedKey = null;
        try { localStorage.setItem(TAP_KEY, JSON.stringify(tapPoint)); localStorage.removeItem(LKEY_KEY); } catch (er) {}
        endLearning();
        toast("가운데 버튼 등록: 화면 터치 (" + Math.round(sx) + "," + Math.round(sy) + ")");
        return;
      }
      if (remoteOn && tapPoint &&
          Math.abs(sx - tapPoint.fx * window.innerWidth) <= 14 &&
          Math.abs(sy - tapPoint.fy * window.innerHeight) <= 14) {
        e.preventDefault();
        swallowClickUntil = Date.now() + 700;
        selectChannel(sel === 0 ? 1 : 0);
      }
      return;
    }
    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
      var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "→" : "←") : (dy > 0 ? "↓" : "↑");
      lastKeyEl.textContent = " [스와이프 " + dir + " (" + Math.round(dx) + "," + Math.round(dy) + ")]";
      var major = Math.max(Math.abs(dx), Math.abs(dy)), minor = Math.min(Math.abs(dx), Math.abs(dy));
      if (remoteOn) {
        // 스와이프 끝 지점 아래에 있는 버튼이 따라서 눌리지 않도록 클릭을 막음
        if (e.cancelable) e.preventDefault();
        swallowClickUntil = Date.now() + 700;
      }
      if (remoteOn && major > minor * 1.5) {
        var st = SWIPE_MAP[dir];
        if (st) startRecording(st, true);
      }
    }
  };
  // touchcancel도 같이 처리: 브라우저가 스와이프를 가로채도(예: 당겨서 새로고침) 방향을 인식
  document.addEventListener("touchend", onTouchEnd, { capture: true, passive: false });
  document.addEventListener("touchcancel", onTouchEnd, { capture: true, passive: false });
  // 리모컨 모드: 스와이프가 아래 패널을 스크롤하거나 화면을 당기지 않도록 이동 동작을 막음
  document.addEventListener("touchmove", function (e) {
    if (!remoteOn || e.touches.length > 1) return;
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.cancelable) e.preventDefault();
  }, { capture: true, passive: false });

  /* ---------- 터치 리모컨 모드 ---------- */
  // 이 리모컨은 버튼을 누르면 화면 스와이프를 보냄 (실측):
  //   상버튼=↓  하버튼=↑  좌버튼=→  우버튼=←
  var SWIPE_MAP = { "↓": "양청", "↑": "난청", "→": "약잡음", "←": "혼신" };
  var REMOTE_KEY = "rx_remote_v1";
  var remoteOn = true;
  try { remoteOn = localStorage.getItem(REMOTE_KEY) !== "0"; } catch (e) {}
  var btnRemote = document.getElementById("btnRemote");
  function applyRemote() {
    btnRemote.classList.toggle("on", remoteOn);
    if (remoteOn) map.dragging.disable(); else map.dragging.enable();
  }
  btnRemote.addEventListener("click", function () {
    remoteOn = !remoteOn;
    try { localStorage.setItem(REMOTE_KEY, remoteOn ? "1" : "0"); } catch (e) {}
    applyRemote();
    toast(remoteOn ? "터치 리모컨 모드 켬 (지도 드래그 잠금)" : "터치 리모컨 모드 끔 (지도 드래그 가능)");
  });
  applyRemote();

  /* ---------- 리모컨 가운데(재생/일시정지) 버튼 = 주파수 전환 ---------- */
  // 🎯 버튼을 누른 뒤 리모컨 가운데 버튼을 한 번 누르면 그 신호(키 또는 화면 터치 위치)를 등록
  var MEDIA_KEYS = ["MediaPlayPause", "MediaPlay", "MediaPause", "Play", "Pause"];
  var TAP_KEY = "rx_tap_v1", LKEY_KEY = "rx_lkey_v1";
  var tapPoint = null, learnedKey = null;
  try {
    tapPoint = JSON.parse(localStorage.getItem(TAP_KEY));
    learnedKey = localStorage.getItem(LKEY_KEY);
  } catch (e) {}
  var learning = false, learnTimer = null, swallowClickUntil = 0;
  var btnLearn = document.getElementById("btnLearn");
  function endLearning() {
    learning = false;
    clearTimeout(learnTimer);
    btnLearn.classList.remove("on");
  }
  btnLearn.addEventListener("click", function () {
    if (learning) { endLearning(); toast("등록 취소"); return; }
    learning = true;
    btnLearn.classList.add("on");
    toast("리모컨 가운데(재생/일시정지) 버튼을 한 번 누르세요");
    learnTimer = setTimeout(function () { if (learning) { endLearning(); toast("등록 시간 초과"); } }, 20000);
  });
  document.addEventListener("click", function (e) {
    if (Date.now() < swallowClickUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  function render() {
    document.getElementById("count").textContent = "기록 " + records.length + "건 (최근 5건 표시)";
    var ul = document.getElementById("list");
    ul.innerHTML = "";
    records.slice(-5).reverse().forEach(function (r) {
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = COLORS[r.status];
      var b = document.createElement("b");
      b.textContent = r.status;
      var txt = document.createElement("span");
      txt.textContent = (r.ch === 1 ? "②" : "①") + " " + r.freq + " MHz";
      var sm = document.createElement("small");
      sm.textContent = r.time.slice(5) + " ±" + r.acc + "m";
      li.appendChild(dot); li.appendChild(b); li.appendChild(txt); li.appendChild(sm);
      ul.appendChild(li);
    });
  }

  document.getElementById("btnUndo").addEventListener("click", function () {
    if (!records.length) { toast("취소할 기록이 없습니다"); return; }
    var r = records.pop();
    saveRecords();
    redrawMarkers();
    render();
    toast("마지막 기록(" + r.status + ") 취소");
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    if (!records.length) { toast("삭제할 기록이 없습니다"); return; }
    if (confirm("기록 " + records.length + "건을 모두 삭제할까요?\n(먼저 CSV로 저장했는지 확인하세요)")) {
      records = [];
      saveRecords();
      redrawMarkers();
      render();
      toast("전체 삭제됨");
    }
  });

  /* ---------- CSV ---------- */
  function buildCsv() {
    var lines = ["일시,주파수(MHz),위도,경도,정확도(m),수신상태"];
    records.forEach(function (r) {
      lines.push([esc(r.time), esc(r.freq), r.lat, r.lon, r.acc, esc(r.status)].join(","));
    });
    return "\uFEFF" + lines.join("\r\n") + "\r\n";
  }
  function csvName() { return "수신상태_" + fileStamp(new Date()) + ".csv"; }

  document.getElementById("btnExport").addEventListener("click", function () {
    if (!records.length) { toast("저장할 기록이 없습니다"); return; }
    var blob = new Blob([buildCsv()], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = csvName();
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("CSV 저장 (" + records.length + "건)");
  });

  var btnShare = document.getElementById("btnShare");
  try {
    var testFile = new File(["x"], "t.csv", { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [testFile] })) btnShare.style.display = "";
  } catch (e) {}
  btnShare.addEventListener("click", function () {
    if (!records.length) { toast("공유할 기록이 없습니다"); return; }
    var file = new File([buildCsv()], csvName(), { type: "text/csv" });
    navigator.share({ files: [file], title: "수신상태 기록" }).catch(function () {});
  });

  /* ---------- 화면 항상 켜짐 (Wake Lock) ---------- */
  var AWAKE_KEY = "rx_awake_v1";
  var wakeLock = null;
  var wantAwake = true;
  try { wantAwake = localStorage.getItem(AWAKE_KEY) !== "0"; } catch (e) {}
  var btnAwake = document.getElementById("btnAwake");

  function updateAwakeBtn() {
    btnAwake.classList.toggle("on", !!wakeLock);
  }
  function requestWake(showMsg) {
    if (!wantAwake) return;
    if (!("wakeLock" in navigator)) {
      if (showMsg) toast("이 브라우저는 화면 켜짐 유지를 지원하지 않습니다");
      return;
    }
    if (wakeLock || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      updateAwakeBtn();
      lock.addEventListener("release", function () {
        wakeLock = null;
        updateAwakeBtn();
      });
      if (showMsg) toast("화면 항상 켜짐: 켬");
    }).catch(function () {
      if (showMsg) toast("화면 켜짐 유지 실패 (절전모드 확인)");
    });
  }
  function releaseWake() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    updateAwakeBtn();
  }
  btnAwake.addEventListener("click", function () {
    wantAwake = !wantAwake;
    try { localStorage.setItem(AWAKE_KEY, wantAwake ? "1" : "0"); } catch (e) {}
    if (wantAwake) requestWake(true);
    else { releaseWake(); toast("화면 항상 켜짐: 끔"); }
  });
  // 다른 앱/화면 갔다가 돌아오면 자동 해제되므로 다시 요청
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") requestWake(false);
  });
  // 시작 시 요청, 일부 브라우저는 첫 터치가 필요하므로 한 번 더 시도
  requestWake(false);
  document.addEventListener("pointerdown", function () { requestWake(false); }, { once: true });

  updateRunUI();
  render();
  redrawMarkers();
  if (records.length) {
    var last = records[records.length - 1];
    map.setView([last.lat, last.lon], 14);
  }
})();
</script>
</body>
</html>
